services:
  backend:
    build: ./backend
    container_name: metalradar-backend
    environment:
      - DATABASE_URL=sqlite:///./data/metalradar.db
      - CORS_ORIGINS=["http://localhost","http://localhost:80"]
      - DEBUG=false
    volumes:
      - backend_data:/app/data
      - backend_cache:/app/.cache
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: metalradar-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
  backend_cache:
